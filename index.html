<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

<body>

    <header>
        <h1>أهلاً بكم Welcome!</h1>
        <p>هنا تجدون كل ماتريد.</p>
    </header>

    <hr>

    <main>
        <section>
            <h2>من أنا؟</h2>
            <p>أنا مطور وب إسمي BHM      <strong></strong> وكيفية ترتيب عناصر الصفحة.</p>
        </section>

        <section>
            <h2>نموذج التواصل:</h2>

                <label for="username">الاسم الكامل:</label><br>
                <input type="text" id="username" name="username" placeholder="أدخل اسمك هنا" required>
                <br><br>

                <label for="user-email">البريد الإلكتروني:</label><br>
                <input type="email" id="user-email" name="email" placeholder="example@mail.com" required>
                <br><br>

                <button type="submit">إرسال البيانات</button>
            </form>
        </section>
    </main>

    <hr>

    <footer>
        <p>جميع الحقوق محفوظة &copy; 2026</p>
    </footer>
